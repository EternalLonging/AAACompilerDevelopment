<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniC · 编译实验室</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="/">m<span>c</span><i>编译实验室</i></a><div class="header-note">从一行源码，看见整个过程。</div><span class="local-dot">本地运行</span></header>
<main>
<section class="intro"><div><span class="eyebrow">MINIC / WORKBENCH</span><h1>写下代码。<em>看见它如何运行。</em></h1></div><div class="intro-right"><span id="status" role="status">准备就绪</span><button id="analyze" class="secondary">分析源码</button><button id="run" class="primary">编译并运行 <b>↗</b></button></div></section>
<section class="workspace">
<div class="editor-panel">
<div class="panel-heading"><span><b class="step-index">01</b> 源码编辑</span><select id="example" aria-label="载入示例"><option value="">选择演示程序</option></select></div>
<div class="file-bar"><select id="file" aria-label="正在编辑的文件"><option>main.c</option></select><button id="add-file" title="新建本地头文件">＋ 头文件</button><button id="import" title="导入 C 或头文件">导入</button><button id="save-source">下载源码</button><input id="upload" type="file" accept=".c,.h,.json" hidden></div>
<div class="code-wrap"><div id="lines" aria-hidden="true">1</div><textarea id="editor" spellcheck="false" aria-label="源码编辑器" autocomplete="off" autocapitalize="off" wrap="off"></textarea><div id="completion" class="completion" role="listbox" aria-label="代码补全" hidden></div></div>
<div class="editor-footer"><span id="position">行 1 · 列 1</span><span>Ctrl + Space 补全 · Ctrl + Enter 运行</span></div>
<div class="input-box"><label for="stdin">程序输入 <small>供 scanf 读取，两侧执行使用相同输入</small></label><textarea id="stdin" rows="2" placeholder="例如：5" aria-label="程序输入"></textarea></div>
<div class="project-actions"><button id="save-project">保存项目</button><button id="reset">清空编辑器</button><span id="completion-note">补全使用当前作用域中的名字</span></div>
</div>
<div class="result-panel">
<nav class="stage-tabs" aria-label="编译阶段"><button data-view="ast" class="active">语法树</button><button data-view="tokens">单词表</button><button data-view="symbols">符号表</button><button data-view="ir">四元式</button><button data-view="compare">优化对比</button><button data-view="preprocessed">预处理</button></nav>
<div class="result-heading"><div><span class="eyebrow" id="view-kicker">SYNTAX TREE</span><h2 id="view-title">语法树</h2><p id="view-description">真实节点与父子关系。点击节点可以定位到源码。</p></div><button id="export" class="secondary small">导出结果 ↓</button></div>
<div id="result" class="result-body"><div class="empty"><span>⌘</span><h3>先写一段代码</h3><p>点击「分析源码」，查看编译器实际生成的结果。</p></div></div>
<div class="terminal"><div class="terminal-title"><span>运行输出</span><span id="run-detail">尚未执行</span></div><pre id="output">输出将显示在这里。</pre></div>
<div class="diagnostics"><div class="diagnostic-title">诊断 <span id="diagnostic-count">0</span></div><div id="diagnostics"><span class="muted">尚未分析。</span></div></div>
</div>
</section>
<footer><span>项目语言 · C++17 编译器 / 四元式解释执行</span><span>本地头文件可用 · 不包含系统标准库</span></footer>
</main>
<div id="toast" role="alert" hidden></div>
<script src="/app.js"></script>
</body></html>
